# TODO: Documentar está classe.

server:
  port: 8085

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_URL:localhost}:${DB_PORT:5432}/${DB_NAME:houpper}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:develop}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        '[format_sql]': true
        '[show_sql]': true
    open-in-view: false


