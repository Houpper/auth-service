logging:
  level:
    # Nível padrão da aplicação.
    # INFO exibe logs INFO, WARN e ERROR.
    root: INFO

    # Logs da aplicação (LOGGER.info(), LOGGER.warn(), LOGGER.error()).
    '[br.com.houpper]': INFO

    # Spring Framework.
    '[org.springframework]': INFO

    # Spring JDBC.
    '[org.springframework.jdbc]': INFO

    # Gerenciamento de transações.
    '[org.springframework.transaction]': INFO

    # Spring Security.
    '[org.springframework.security]': INFO

    # Hibernate.
    '[org.hibernate]': WARN

    # SQL gerado pelo Hibernate.
    '[org.hibernate.SQL]': WARN

    # Valores dos parâmetros enviados nas consultas SQL.
    '[org.hibernate.orm.jdbc.bind]': WARN

    # Valores retornados pelo JDBC.
    '[org.hibernate.orm.jdbc.extract]': WARN

    # Conversão de tipos JDBC.
    '[org.hibernate.type.descriptor.jdbc]': WARN

    # Flyway.
    '[org.flywaydb]': INFO

    # Pool de conexões HikariCP.
    '[com.zaxxer.hikari]': INFO

    # Tomcat.
    '[org.apache.catalina]': INFO
    '[org.apache.tomcat]': INFO